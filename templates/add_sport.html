{% extends 'base.html' %}
{% block title %}Add Sport - Sports Society{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add New Sport</h1>
    <p>Register a new sport category in your society</p>
</div>

<div class="form-card fade-in">
    <form method="POST" action="{{ url_for('add_sport') }}">
        <div class="form-group">
            <label for="sport-name">Sport Name *</label>
            <input type="text" name="name" id="sport-name" placeholder="e.g. Table Tennis" required>
        </div>
        <div class="form-group">
            <label for="sport-icon">Icon (Emoji) *</label>
            <input type="text" name="icon" id="sport-icon" placeholder="e.g. 🏓" required maxlength="4">
            <div class="form-hint">Use an emoji that represents the sport</div>
        </div>
        <div class="form-group">
            <label for="max-players">Max Players Per Team *</label>
            <input type="number" name="max_players" id="max-players" placeholder="e.g. 11" required min="1" max="50">
        </div>
        <div class="form-group">
            <label for="sport-color">Theme Color</label>
            <div class="color-preview">
                <input type="color" name="color" id="sport-color" value="#3b82f6">
                <span style="color:var(--text-secondary);font-size:.85rem;">Choose a color for this sport</span>
            </div>
        </div>
        <div class="form-group">
            <label for="sport-desc">Description (Optional)</label>
            <textarea name="description" id="sport-desc" placeholder="Brief description of the sport..."></textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" id="submit-sport-btn">Add Sport</button>
            <a href="{{ url_for('sports') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
