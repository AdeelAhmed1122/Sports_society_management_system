{% extends 'base.html' %}
{% block title %}New Announcement - Sports Society{% endblock %}
{% block content %}
<div class="page-header">
    <h1>New Announcement</h1>
    <p>Publish a notice or alert to members</p>
</div>

<div class="form-card fade-in">
    <form method="POST" action="{{ url_for('add_announcement') }}">
        <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" required placeholder="e.g. Registration Deadline Extended">
        </div>
        <div class="form-group">
            <label>Content *</label>
            <textarea name="content" required placeholder="Write your announcement here..." style="min-height:120px;"></textarea>
        </div>
        <div class="form-row" style="margin-bottom:1.2rem;">
            <div class="form-group" style="flex:1;margin-bottom:0;">
                <label>Priority</label>
                <select name="priority">
                    <option value="Normal">🔵 Normal</option>
                    <option value="Important">🟡 Important</option>
                    <option value="Urgent">🔴 Urgent</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;margin-bottom:0;">
                <label>Category</label>
                <select name="category">
                    <option value="General">General</option>
                    <option value="Event">Event</option>
                    <option value="Result">Result</option>
                    <option value="Schedule">Schedule</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                <input type="checkbox" name="is_pinned" value="1" style="width:auto;">
                📌 Pin this announcement to the top
            </label>
        </div>
        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-primary">📢 Publish Announcement</button>
            <a href="{{ url_for('announcements') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
