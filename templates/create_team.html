{% extends 'base.html' %}
{% block title %}Create Team - Sports Society{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Create New Team</h1>
    <p>Set up a new team for any sport</p>
</div>

<div class="form-card fade-in">
    <form method="POST" action="{{ url_for('create_team') }}">
        <div class="form-group">
            <label for="team-name">Team Name</label>
            <input type="text" name="name" id="team-name" placeholder="e.g. Thunder Strikers" required>
        </div>
        <div class="form-group">
            <label for="sport-select">Select Sport</label>
            <select name="sport_id" id="sport-select" required>
                <option value="" disabled selected>Choose a sport...</option>
                {% for sport in sports %}
                <option value="{{ sport.id }}">{{ sport.icon }} {{ sport.name }} (Max {{ sport.max_players }} players)</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex;gap:10px;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" id="create-team-btn">Create Team</button>
            <a href="{{ url_for('teams') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
